name: Configure access to the private CosmWasm forks
description: Mint a GitHub App token and redirect github.com/CosmWasm/wasmvm to the private fork.

inputs:
  app-id:
    description: GitHub App ID.
    required: true
  private-key:
    description: GitHub App private key (PEM).
    required: true
  repositories:
    description: Repositories the token may read.
    required: false
    default: priv_wasmvm_sec

outputs:
  token:
    description: The installation token, for builds that need it (e.g. docker).
    value: ${{ steps.app-token.outputs.token }}

runs:
  using: composite
  steps:
    - name: Mint an installation token
      id: app-token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        # Without these the token is scoped to the current repository only.
        owner: CosmWasm
        repositories: ${{ inputs.repositories }}

    - name: Redirect wasmvm to the private fork
      shell: bash
      env:
        TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        if [[ -z "$TOKEN" ]]; then
          echo "::error::No installation token was minted. Check the app is installed on the requested repositories." >&2
          exit 1
        fi

        git config --global \
          url."https://x-access-token:${TOKEN}@github.com/CosmWasm/priv_wasmvm_sec".insteadOf \
          "https://github.com/CosmWasm/wasmvm"

        # Keep the module off the public proxy and checksum database.
        echo "GOPRIVATE=github.com/CosmWasm/wasmvm" >> "$GITHUB_ENV"
